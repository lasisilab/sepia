project:
  type: website
  output-dir: _site
  # Execute code with the working directory at the project root, so the
  # analysis pages' `data/...` paths resolve the same way workflowr's did
  # (workflowr used knit_root_dir: ".").
  execute-dir: project
  # RENDER LIST — only the pages that build in CI (no R, or frozen). The thesis
  # analysis pages (introduction/depth/pca/cleaning) execute R against derived
  # CSVs that are not committed and need GDAL/GEOS/PROJ (maps) — per MIGRATION.md
  # they require a one-time local render on a machine with the data to populate
  # _freeze/. Until that happens they are excluded so the site can deploy; they
  # will be restored (here + in the navbar) once _freeze/ is committed, and SEPIA
  # is regenerating those analyses anyway. sgdp_reference_pca.qmd is frozen.
  render:
    - index.qmd
    - about.qmd
    - license.qmd
    - sgdp_reference_pca.qmd
    - snp_panel.qmd
    - panel_coverage.qmd
    - archaic_projection.qmd

website:
  title: "SEPIA"
  description: "Pigmentation genetics in archaic hominins"
  site-url: https://lasisilab.github.io/sepia/
  repo-url: https://github.com/lasisilab/sepia
  navbar:
    title: "SEPIA"
    left:
      - href: index.qmd
        text: Home
      - href: sgdp_reference_pca.qmd
        text: "Reference PCA"
      - href: snp_panel.qmd
        text: "SNP set"
      - href: panel_coverage.qmd
        text: "Coverage"
      - href: archaic_projection.qmd
        text: "Projection"
      - href: about.qmd
        text: About
      - href: license.qmd
        text: License
      # Background / Depth / PCA (introduction.qmd, depth.qmd, pca.qmd) are
      # temporarily out of the navbar + render list — they need a local render
      # with data to populate _freeze/ (see project.render note above).
    right:
      - icon: github
        href: https://github.com/lasisilab/sepia
        aria-label: GitHub
  # NOTE: cleaning.qmd renders but is intentionally left out of the navbar
  # (it was not in the workflowr navbar either). The project plan is served at
  # /plan/ by the publish workflow and is deliberately NOT linked here.

format:
  html:
    theme: cosmo          # same theme workflowr used
    toc: true
    toc-depth: 2
    code-fold: true
    code-tools: true

execute:
  # freeze: auto  → use the committed _freeze/ results if present, otherwise
  # execute. CI has no R/data, so the R-heavy pages (introduction, depth, pca,
  # cleaning) MUST be rendered once locally (with R + the data files) to populate
  # _freeze/, which is then committed. See MIGRATION.md. Prose pages (index,
  # about, license) render fine without any of that.
  freeze: auto
  warning: false
  message: false
